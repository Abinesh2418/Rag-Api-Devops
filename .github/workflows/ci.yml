name: RAG CI Pipeline

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  path-filter:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rag_changed: ${{ steps.filter.outputs.rag_changed }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rag_changed:
              - 'docs/**'
              - 'backend/app.py'
              - 'scripts/embed_docs.py'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=backend --cov-report=term-missing --cov-report=xml
        env:
          AZURE_OPENAI_API_KEY: "test-key"
          AZURE_OPENAI_ENDPOINT: "https://test.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
          AZURE_OPENAI_MODEL: "gpt-4o"

      - name: Check coverage threshold
        run: coverage report --fail-under=80

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pip-audit for vulnerability scanning
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  integration:
    needs: [path-filter, lint, unit-tests, security]
    if: github.event_name == 'pull_request' || needs.path-filter.outputs.rag_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild embeddings
        run: python scripts/embed_docs.py

      - name: Start API
        run: |
          uvicorn backend.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
          AZURE_OPENAI_MODEL: "gpt-4o"

      - name: Run semantic tests
        run: python tests/semantic_test.py

      - name: Success
        run: echo "All tests passed! RAG quality maintained."

  build:
    needs: [lint, unit-tests, security, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/backend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/backend:${{ github.sha }}

      - name: Build and push Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:latest
            ghcr.io/${{ steps.repo.outputs.name }}/frontend:${{ github.sha }}

  ai-repair:
    needs: [unit-tests]
    if: always() && needs.unit-tests.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Capture test failures
        run: pytest tests/ -v --tb=short 2>&1 | tee test_failures.txt || true
        env:
          AZURE_OPENAI_API_KEY: "test-key"
          AZURE_OPENAI_ENDPOINT: "https://test.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
          AZURE_OPENAI_MODEL: "gpt-4o"

      - name: Run AI repair agent
        run: python scripts/ai_repair.py
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
          AZURE_OPENAI_MODEL: "gpt-4o"

      - name: Check if AI produced a fix
        id: check-changes
        run: |
          if git diff --quiet app.py; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push fix to new branch
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config user.name "AI DevOps Bot"
          git config user.email "ai-bot@noreply.github.com"
          BRANCH="ai-fix/run-${{ github.run_id }}"
          git checkout -b $BRANCH
          git add backend/app.py
          git commit -m "ai-fix: auto-repair unit-test failure from run #${{ github.run_id }}"
          git push origin $BRANCH

      - name: Open pull request with AI fix
        if: steps.check-changes.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const failureLog = fs.readFileSync('test_failures.txt', 'utf8').slice(-2000);
            const branch = `ai-fix/run-${{ github.run_id }}`;
            const base = '${{ github.ref_name }}';
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[AI Fix] Unit test failure on ${base} — run #${{ github.run_id }}`,
              head: branch,
              base: base,
              body: [
                '## AI-Generated Repair',
                '',
                'This PR was automatically created by the **AI repair agent** after unit tests failed on `' + base + '`.',
                '',
                '### What failed',
                '```',
                failureLog,
                '```',
                '',
                '### What the AI changed',
                'See the diff above. The AI was scoped to fix only `app.py` for the failing test(s) without restructuring unrelated code.',
                '',
                '---',
                '> **Human review required before merging.**',
                '> Merging this PR will trigger a fresh CI run on the corrected code — the second pass of the two-pass self-healing loop.'
              ].join('\n')
            });

  notify:
    needs: [path-filter, lint, unit-tests, security, integration, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get failed jobs summary
        id: failed-jobs
        run: |
          FAILED_JOBS=""
          if [ "${{ needs.path-filter.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- path-filter\n"
          fi
          if [ "${{ needs.lint.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- lint\n"
          fi
          if [ "${{ needs.unit-tests.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- unit-tests\n"
          fi
          if [ "${{ needs.security.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- security\n"
          fi
          if [ "${{ needs.integration.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- integration\n"
          fi
          if [ "${{ needs.build.result }}" == "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS}- build\n"
          fi
          echo "failed_jobs<<EOF" >> $GITHUB_OUTPUT
          echo -e "$FAILED_JOBS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR on failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const failedJobs = `${{ steps.failed-jobs.outputs.failed_jobs }}`;
            const body = `## CI Pipeline Failed

            The following job(s) failed:
            ${failedJobs}

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

